# Docker DNS updates service addresses when Compose replaces a container.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream system_rails {
    zone system_rails 64k;
    server app-system:3000 resolve;
}

upstream website_rails {
    zone website_rails 64k;
    server app-website:3000 resolve;
}

upstream report_rails {
    zone report_rails 64k;
    server app-report:3000 resolve;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;

    location ~ ^/system(?:/|$) {
        proxy_pass http://system_rails;
    }

    location ~ ^/website(?:/|$) {
        proxy_pass http://website_rails;
    }

    location ~ ^/report(?:/|$) {
        proxy_pass http://report_rails;
    }

    location / {
        return 404;
    }
}
