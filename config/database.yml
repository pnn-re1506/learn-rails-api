# Each module has its own database, but all three live on the SAME MySQL server:
#   system  -> system_*   (engines/system)
#   website -> website_*  (engines/website)
#   report  -> report_*   (engines/report)
# `migrations_paths` decides which migrations run on which database.
# Being on one server is what lets Report JOIN a Website table (see Website::ReportJoin).

mysql: &mysql
  adapter: mysql2
  encoding: utf8mb4
  host: <%= ENV.fetch("MYSQL_HOST", "localhost") %>
  port: <%= ENV.fetch("MYSQL_PORT", 3306) %>
  username: <%= ENV.fetch("MYSQL_USER", "root") %>
  password: <%= ENV.fetch("MYSQL_PASSWORD", "password") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  system:
    <<: *mysql
    database: system_dev
    migrations_paths: engines/system/db/migrate
  website:
    <<: *mysql
    database: website_dev
    migrations_paths: engines/website/db/migrate
  report:
    <<: *mysql
    database: report_dev
    migrations_paths: engines/report/db/migrate

test:
  system:
    <<: *mysql
    database: system_test
    migrations_paths: engines/system/db/migrate
  website:
    <<: *mysql
    database: website_test
    migrations_paths: engines/website/db/migrate
  report:
    <<: *mysql
    database: report_test
    migrations_paths: engines/report/db/migrate
