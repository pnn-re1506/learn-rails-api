# Each module has its own database AND its own MySQL server (3 different ports):
#   system  -> system_*   :3307  (engines/system)
#   website -> website_*  :3308  (engines/website)
#   report  -> report_*   :3309  (engines/report)
# `migrations_paths` decides which migrations run on which database.
# The servers are separate, so Report cannot write `website_dev`.`sites` in a query. Instead the report
# server holds a FEDERATED table `sites` that points to the website server (see Website::ReportJoin).
# The *_MYSQL_HOST / *_MYSQL_PORT variables point to every server; the defaults match docker-compose
# when Rails runs on your machine (inside Docker, docker-compose sets the service names and port 3306).

mysql: &mysql
  adapter: mysql2
  encoding: utf8mb4
  username: <%= ENV.fetch("MYSQL_USER", "root") %>
  password: <%= ENV.fetch("MYSQL_PASSWORD", "password") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

system: &system
  <<: *mysql
  host: <%= ENV.fetch("SYSTEM_MYSQL_HOST", "localhost") %>
  port: <%= ENV.fetch("SYSTEM_MYSQL_PORT", 3307) %>
  migrations_paths: engines/system/db/migrate

website: &website
  <<: *mysql
  host: <%= ENV.fetch("WEBSITE_MYSQL_HOST", "localhost") %>
  port: <%= ENV.fetch("WEBSITE_MYSQL_PORT", 3308) %>
  migrations_paths: engines/website/db/migrate

report: &report
  <<: *mysql
  host: <%= ENV.fetch("REPORT_MYSQL_HOST", "localhost") %>
  port: <%= ENV.fetch("REPORT_MYSQL_PORT", 3309) %>
  migrations_paths: engines/report/db/migrate

development:
  system:
    <<: *system
    database: system_dev
  website:
    <<: *website
    database: website_dev
  report:
    <<: *report
    database: report_dev

test:
  system:
    <<: *system
    database: system_test
  website:
    <<: *website
    database: website_test
  report:
    <<: *report
    database: report_test
